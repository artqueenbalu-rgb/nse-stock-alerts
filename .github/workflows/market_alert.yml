name: NSE Stock, Gold BeES & Silver BeES App Alert

on:
  schedule:
    # Runs strictly during NSE Market Hours (09:15 AM - 03:30 PM IST = 03:45 - 10:00 UTC, Mon-Fri)
    - cron: '45 3 * * 1-5'
    - cron: '15,45 4-9 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

jobs:
  nse-price-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Scan NSE Prices on GitHub & Push Alerts
        env:
          NTFY_TOPIC: "nse-alerts-in-2076"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python nse_dip_predictor.py
      - name: Save Fetched NSE Prices & Alert History to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add watchlist.json alerts_history.json
          if ! git diff --staged --quiet; then
            git commit -m "Update live NSE market data & alerts from GitHub scan"
            git pull --rebase -X ours origin main || true
            git push origin HEAD:main
          fi