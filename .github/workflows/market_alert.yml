name: NSE Stock, Gold BeES & Silver BeES App Alert

on:
  schedule:
    - cron: '*/30 4-10 * * 1-5'
    - cron: '15 10 * * 1-5'
  workflow_dispatch:

jobs:
  nse-price-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Scan NSE Prices on GitHub & Push Alerts
        env:
          NTFY_TOPIC: "nse-alerts-in-3915"
        run: python nse_dip_predictor.py
      - name: Save Fetched NSE Prices & Alert History to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add watchlist.json alerts_history.json || true
          git diff --staged --quiet || git commit -m "Update live NSE market data & alerts from GitHub scan"
          git push